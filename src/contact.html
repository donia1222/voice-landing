<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
{{> cabeza}}
</head>
<body>

{{> cabecera}}

<main>
  <section>
    <div class="contenedor prosa">
      <p class="etiqueta"><span class="punto"></span>{{contact}}</p>
      <h1 style="font-size:var(--t-2xl);margin:1rem 0 .8rem">{{meta.title}}</h1>
      <p class="entradilla" style="margin-bottom:2.5rem">{{f.intro}}</p>

      <form id="formulario-contacto">
        <div class="campo">
          <label for="nombre">{{f.nombre}}</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" required>
        </div>
        <div class="campo">
          <label for="email">{{f.email}}</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="asunto">{{f.asunto}}</label>
          <input type="text" id="asunto" name="asunto" required>
        </div>
        <div class="campo">
          <label for="mensaje">{{f.mensaje}}</label>
          <textarea id="mensaje" name="mensaje" required></textarea>
        </div>
        <button class="boton boton-acento" type="submit">{{f.enviar}}</button>
        <p style="margin-top:1rem;font-size:var(--t-xs);color:var(--muted)">{{f.nota}}</p>
      </form>

      <p style="margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--rule)">
        {{f.directo}} <a href="mailto:info@lweb.ch">info@lweb.ch</a>
      </p>
    </div>
  </section>
</main>

<script>
  // Sin servidor: el formulario abre el cliente de correo con todo escrito.
  document.getElementById('formulario-contacto').addEventListener('submit', function (e) {
    e.preventDefault()
    var d = new FormData(e.target)
    var cuerpo = d.get('mensaje') + '\n\n— ' + d.get('nombre') + ' (' + d.get('email') + ')'
    window.location.href =
      'mailto:info@lweb.ch?subject=' + encodeURIComponent('[Voice Grocery] ' + d.get('asunto')) +
      '&body=' + encodeURIComponent(cuerpo)
  })
</script>

{{> pie}}

</body>
</html>
