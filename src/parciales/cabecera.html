<header class="cabecera" id="cabecera">
  <div class="contenedor">
    <a class="marca" href="{{inicio}}">
      <img src="/img/icono.webp" alt="" width="34" height="34">
      Voice Grocery
    </a>

    <nav class="nav" aria-label="{{meta.title}}">
      <a href="{{inicio}}#funciones">{{features}}</a>
      <a href="{{inicio}}#precios">{{pricing}}</a>
      <a href="{{soporte}}">{{support}}</a>
      <a href="{{contacto}}">{{contact}}</a>
    </nav>

    <details class="idiomas">
      <summary aria-label="Idioma">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
          <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>
        </svg>
        <span>{{lang}}</span>
      </summary>
      <div class="idiomas-lista">
        {{{selectorIdiomas}}}
      </div>
    </details>

    <button class="tema" id="cambia-tema" aria-label="Cambiar tema" type="button">
      <svg class="tema-luna" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="tema-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>
